name: E2E

on:
  pull_request:
    branches: [main, canary]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

# Playwright against a production build and a throwaway Neon branch.
# Off until the Neon test database exists: set the repo variable E2E_ENABLED=true
# and the secret E2E_DATABASE_URL.

jobs:
  playwright:
    if: vars.E2E_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
      AUTH_SECRET: ${{ secrets.E2E_AUTH_SECRET }}
      E2E_TEST_AUTH: 'true'
      CODE_RUNNER: fake
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run db:migrate
      - run: bun run seed
      - run: bun run build
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
