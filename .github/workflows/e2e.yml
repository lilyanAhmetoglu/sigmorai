name: E2E

on:
  pull_request:
    branches: [main, canary]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

# Playwright against a production build and a throwaway Neon branch.
# Off until the Neon test database exists: set the repo variable E2E_ENABLED=true
# and the secret E2E_DATABASE_URL.

# Read-only token: this job only checks out and tests.
permissions:
  contents: read

jobs:
  playwright:
    if: vars.E2E_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run db:migrate
      - run: bun run seed
      - run: bun run build
      - run: bun run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
