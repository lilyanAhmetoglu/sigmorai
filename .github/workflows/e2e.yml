name: E2E

on:
  pull_request:
    branches: [main, canary]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

# One shared Neon branch (`e2e`) and one Clerk test user: runs queue, never overlap.
concurrency:
  group: e2e
  cancel-in-progress: false

# Playwright (one Chromium flow + axe) against a production build and the
# shared Neon branch `e2e` (a child of `dev`), migrated and seeded on each run.
# Off until the maintainer sets it up (ENGINEERING.md → Amendments 2026-10-06, E2E):
#   vars:    E2E_ENABLED=true, NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY (pk_test_)
#   secrets: CLERK_SECRET_KEY (sk_test_), E2E_DATABASE_URL, E2E_DATABASE_URL_UNPOOLED
# Development-instance Clerk keys only: production keys never go into CI.

# Read-only token: this job only checks out and tests.
permissions:
  contents: read

jobs:
  playwright:
    # Fork PRs get no secrets: skip them instead of failing.
    if: vars.E2E_ENABLED == 'true' && github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.E2E_DATABASE_URL_UNPOOLED }}
      NEON_BRANCH: e2e
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run db:migrate
      - run: bun run seed
      - run: bun run build
      - run: bun run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
