name: Mentor index

# Syncs mentor_chunks (the mentor's pgvector search index) with content/ and
# the pages lessons cite (docs/plans/mentor-design-plan.md, Phase 1). Only new
# chunks are embedded, so a run with no change costs nothing and writes nothing.
#
# Off until the maintainer sets the repo variable MENTOR_ENABLED=true and the
# secrets VOYAGE_API_KEY + DATABASE_URL_UNPOOLED. The first run is a manual
# dispatch after migrations 0007 + 0008 are applied.
#
# GitHub runs scheduled workflows only from the default branch (main).
# It can race migrate.yml on a release that also changes drizzle/**: if a run
# fails on a schema change, re-run it by hand after the migration.

on:
  push:
    branches: [main]
    paths:
      [
        'content/**',
        'lib/mentor/**',
        'lib/constants/mentor.ts',
        'lib/content/**',
        'scripts/mentor-index.ts',
      ]
  schedule:
    # Weekly: catches cited pages that changed without a content commit.
    - cron: '23 5 * * 1'
  workflow_dispatch:

concurrency:
  group: mentor-index
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  index:
    if: vars.MENTOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run mentor:index
        env:
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
