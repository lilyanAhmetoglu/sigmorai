name: CI

on:
  pull_request:
  push:
    branches: [main, canary]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run test
      - run: bun run hooks:test
      - run: bun run build
        env:
          # The build must never need real secrets; pages that hit the DB are dynamic.
          SKIP_ENV_VALIDATION: 'true'
