# Knowledge-base registry (docs/plans/knowledge-base-design-plan.md).
# `bun run seed` mirrors it into kb_sources; validated by KbSourcesFileSchema (lib/types/kb.ts).
# Keys match the kb_sources fields. id is a permanent kebab-case slug: never rename one.
# trustTier: official = the vendor's own docs or repo; community = vetted third party.
# fetchConfig (licence, link-only, …) is defined with the fetch job in step 8.

sources:
  - id: claude-docs
    kind: docs
    title: Claude Developer Platform docs
    url: https://platform.claude.com/docs
    owner: anthropic
    trustTier: official

  - id: openai-docs
    kind: docs
    title: OpenAI API docs
    url: https://developers.openai.com/api/docs
    owner: openai
    trustTier: official

  - id: claude-cookbooks
    kind: repo
    title: anthropics/claude-cookbooks
    url: https://github.com/anthropics/claude-cookbooks
    owner: anthropic
    trustTier: official

  - id: openai-agents-python
    kind: repo
    title: openai/openai-agents-python
    url: https://github.com/openai/openai-agents-python
    owner: openai
    trustTier: official

  - id: mcp-servers
    kind: repo
    title: modelcontextprotocol/servers
    url: https://github.com/modelcontextprotocol/servers
    owner: modelcontextprotocol
    trustTier: official

  # Added 2026-10-05 (content validator). Each base URL was fetched and resolved
  # that day. openai.com/index is NOT listed: it returns 403 to automated fetches,
  # so the fact-checker could never verify a claim from it.
  - id: claude-code-docs
    kind: docs
    title: Claude Code docs
    url: https://code.claude.com/docs
    owner: anthropic
    trustTier: official

  - id: anthropic-engineering
    kind: blog
    title: Engineering at Anthropic
    url: https://www.anthropic.com/engineering
    owner: anthropic
    trustTier: official

  - id: openai-cookbook
    kind: docs
    title: OpenAI Developer Cookbook
    url: https://developers.openai.com/cookbook
    owner: openai
    trustTier: official

  - id: mcp-spec
    kind: docs
    title: Model Context Protocol specification
    url: https://modelcontextprotocol.io/specification
    owner: modelcontextprotocol
    trustTier: official

  # Added 2026-10-05 (strategist r0 content). Base fetched and resolved that day.
  - id: gemini-docs
    kind: docs
    title: Gemini API docs
    url: https://ai.google.dev/gemini-api/docs
    owner: google
    trustTier: official

  # Full text of the same paper (Google's page links its PDF here); it holds
  # the attention formula and the reason for dividing by sqrt(d) (floor 8).
  - id: arxiv-attention-paper
    kind: docs
    title: Attention Is All You Need (arXiv)
    url: https://arxiv.org/abs/1706.03762
    owner: google
    trustTier: official

  - id: learn-harness-engineering
    kind: repo
    title: walkinglabs/learn-harness-engineering
    url: https://github.com/walkinglabs/learn-harness-engineering
    owner: walkinglabs
    trustTier: community

  # Added 2026-10-06 (SIG-23 docs-watch). The daily docs-watch job hashes each
  # changelog's index so a release note shows up even before a lesson cites it.
  - id: claude-release-notes
    kind: changelog
    title: Claude Developer Platform release notes
    url: https://platform.claude.com/docs/en/release-notes/overview
    owner: anthropic
    trustTier: official

  - id: openai-changelog
    kind: changelog
    title: OpenAI API changelog
    url: https://developers.openai.com/api/docs/changelog
    owner: openai
    trustTier: official

  # Added 2026-10-06 (Math Tower floors 4-8). Each base fetched and resolved
  # that day. The API reference holds the `temperature` parameter text (floor 5);
  # Google Research's publication page is the official home of the 2017
  # Transformer paper "Attention Is All You Need" (floor 8).
  - id: openai-api-reference
    kind: docs
    title: OpenAI API reference
    url: https://developers.openai.com/api/reference
    owner: openai
    trustTier: official

  - id: google-research-pubs
    kind: docs
    title: Google Research publications
    url: https://research.google/pubs
    owner: google
    trustTier: official

  # Added 2026-10-06 (creator r0c6 Rights & safety). Each url was fetched and
  # read that day. openai.com/policies is NOT listed: it returns 403 to
  # automated fetches, so r0c6 cites OpenAI's developer docs instead.
  - id: anthropic-aup
    kind: docs
    title: Anthropic Usage Policy
    url: https://www.anthropic.com/legal/aup
    owner: anthropic
    trustTier: official

  - id: google-genai-prohibited-use
    kind: docs
    title: Google Generative AI Prohibited Use Policy
    url: https://policies.google.com/terms/generative-ai/use-policy
    owner: google
    trustTier: official

  - id: c2pa
    kind: docs
    title: C2PA (Content Credentials standard)
    url: https://c2pa.org
    owner: c2pa
    trustTier: official

  - id: runway-api-docs
    kind: docs
    title: Runway API documentation
    url: https://docs.dev.runwayml.com
    owner: runway
    trustTier: official

  # Added 2026-10-06 (strategist r7 Swarm Spire). OpenAI's own ChatGPT Enterprise
  # admin and rollout docs (linked from developers.openai.com/llms.txt). Base
  # fetched as raw Markdown that day. help.openai.com is NOT listed: it returns 403.
  - id: chatgpt-docs
    kind: docs
    title: ChatGPT product documentation (OpenAI)
    url: https://learn.chatgpt.com/docs
    owner: openai
    trustTier: official

  # Added 2026-10-07 (creator r5 MCP Bridgelands). Each base was fetched and
  # resolved that day as raw text (Figma's page as HTML, read as text).
  # MCP guides live under /docs; the spec entry above covers /specification.
  - id: mcp-docs
    kind: docs
    title: Model Context Protocol documentation
    url: https://modelcontextprotocol.io/docs
    owner: modelcontextprotocol
    trustTier: official

  - id: claude-connectors-docs
