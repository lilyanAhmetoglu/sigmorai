# Knowledge-base registry (docs/plans/knowledge-base-design-plan.md).
# `bun run seed` mirrors it into kb_sources; validated by KbSourcesFileSchema (lib/types/kb.ts).
# Keys match the kb_sources fields. id is a permanent kebab-case slug: never rename one.
# trustTier: official = the vendor's own docs or repo; community = vetted third party.
# fetchConfig (licence, link-only, …) is defined with the fetch job in step 8.

sources:
  - id: claude-docs
    kind: docs
    title: Claude Developer Platform docs
    url: https://platform.claude.com/docs
    owner: anthropic
    trustTier: official

  - id: openai-docs
    kind: docs
    title: OpenAI API docs
    url: https://developers.openai.com/api/docs
    owner: openai
    trustTier: official

  - id: claude-cookbooks
    kind: repo
    title: anthropics/claude-cookbooks
    url: https://github.com/anthropics/claude-cookbooks
    owner: anthropic
    trustTier: official

  - id: openai-agents-python
    kind: repo
    title: openai/openai-agents-python
    url: https://github.com/openai/openai-agents-python
    owner: openai
    trustTier: official

  - id: mcp-servers
    kind: repo
    title: modelcontextprotocol/servers
    url: https://github.com/modelcontextprotocol/servers
    owner: modelcontextprotocol
    trustTier: official

  # Added 2026-10-05 (content validator). Each base URL was fetched and resolved
  # that day. openai.com/index is NOT listed: it returns 403 to automated fetches,
  # so the fact-checker could never verify a claim from it.
  - id: claude-code-docs
    kind: docs
    title: Claude Code docs
    url: https://code.claude.com/docs
    owner: anthropic
    trustTier: official

  - id: anthropic-engineering
    kind: blog
    title: Engineering at Anthropic
    url: https://www.anthropic.com/engineering
    owner: anthropic
    trustTier: official

  - id: openai-cookbook
    kind: docs
    title: OpenAI Developer Cookbook
    url: https://developers.openai.com/cookbook
    owner: openai
    trustTier: official

  - id: mcp-spec
    kind: docs
    title: Model Context Protocol specification
    url: https://modelcontextprotocol.io/specification
    owner: modelcontextprotocol
    trustTier: official

  - id: learn-harness-engineering
    kind: repo
    title: walkinglabs/learn-harness-engineering
    url: https://github.com/walkinglabs/learn-harness-engineering
    owner: walkinglabs
    trustTier: community
